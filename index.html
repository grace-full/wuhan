<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .status {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .status.authenticated {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status.not-authenticated {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s;
        width: 100%;
        margin-bottom: 10px;
      }

      button:hover {
        background: #5568d3;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .info {
        background: #e7f3ff;
        border: 1px solid #b3d9ff;
        border-radius: 6px;
        padding: 15px;
        margin-top: 20px;
        font-size: 13px;
        color: #004085;
      }

      .info h3 {
        margin-bottom: 10px;
        font-size: 14px;
      }

      .info ul {
        margin-left: 20px;
      }

      .info li {
        margin-bottom: 5px;
      }

      #log {
        margin-top: 20px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 6px;
        max-height: 200px;
        overflow-y: auto;
        font-family: 'Courier New', monospace;
        font-size: 12px;
      }

      .log-entry {
        padding: 4px 0;
        border-bottom: 1px solid #dee2e6;
      }

      .log-entry:last-child {
        border-bottom: none;
      }

      .log-entry.success {
        color: #28a745;
      }

      .log-entry.error {
        color: #dc3545;
      }

      .log-entry.info {
        color: #17a2b8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 Secure Auth Demo</h1>
      <p class="subtitle">Cross-origin configuration demonstration</p>

      <div id="status" class="status not-authenticated">
        Not authenticated
      </div>

      <button id="loginBtn">Open Login Window</button>
      <button id="testApiBtn" disabled>Test API Request</button>
      <button id="logoutBtn" disabled>Logout</button>

      <div class="info">
        <h3>Security Features:</h3>
        <ul>
          <li>✅ Remote domain access for login window</li>
          <li>✅ CSP protection enabled</li>
          <li>✅ Secure cookie persistence</li>
          <li>✅ CORS mitigation via HTTP plugin</li>
          <li>✅ Encrypted token storage</li>
        </ul>
      </div>

      <div id="log"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
